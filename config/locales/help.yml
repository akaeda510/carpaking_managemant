parking_lot:
  title: "駐車場の登録"
  description: "駐車場の登録手順を説明します"
  steps:
    - step: 1
      description: "駐車場作成にはまず右上のメニューバーから'駐車場管理'を選択します(PCの方はサイドバーの駐車場一覧から)"
      image_url: null
      note: null
    - step: 2
      description: "駐車場の作成するには右上の'新しい駐車場を登録'ボタンを選択します。"
      image_url: null
      note: null
    - step: 3
      description: "駐車場エリア作成では必要事項を記入し、作成ボタンを選択します。"
      image_url: null
      note: "作成を取り消す場合はエリア一覧に戻るを選択してください。"
  title: "駐車場の編集"
  description: "駐車場の編集手順を説明します。"
  steps:
    - step: 1
      description: "駐車場一覧から作成された駐車場のアクション(編集)を選択します。"
      image_url: null
      note: null
    - step: 2
      description: "変更したい項目をクリックし、項目を変更してください。"
      image_url: null
      note: null
    - step: 3
      description: "項目を変更後、下の更新するを選択します。"
      image_url: null
      note: "編集を取り消したい場合は、エリア一覧に戻るを選択してください。"
  title: "駐車場の削除"
  description: "登録された駐車場の削除手順を説明します。"
  steps:
    - step: 1
      description: "駐車場一覧から作成した駐車場のアクション'削除'を選択します。"
      image_url: null
      note: null
    - step: 2
      description: "ボタンを押すとメッセージが表示されるので削除する場合はOKを選択してください。取り消したい場合はキャンセルを選択してください。"
      image_url: null
      note: null
    - step: 3
      description: "一度駐車場契約登録をしてしまうと削除できないのでご了承ください。"
      image_url: null
      note: null
parking_area:
  title: "駐車エリアの登録"
  description: "駐車エリアの登録手順を説明します"
  steps:
    - step: 1
      description: "駐車場一覧から作成された駐車場名をクリックします。"
      image_url: null
      note: null
    - step: 2
      description: "右上の'新しいエリアを登録'を選択します。"
      image_url: null
      note: null
    - step: 3
      description: "必要な項目を記入し、エリアを作成を選択します。"
      image_url: null
      note: null
  title: "駐車エリアの編集"
  description: "駐車エリアの編集手順を説明します"
  steps:
    - step: 1
      description: "駐車場一覧から駐車場名をクリックします。"
      image_url: null
      note: null
    - step: 2
      description: "駐車エリア一覧から作成された駐車エリアのアクション'編集'を選択します。"
      image_url: null
      note: null
    - step: 3
      description: "変更したい項目を編集し、更新するを選択します。なお、エリアの標準料金は変更した後から駐車スペースを作成した変更した値段が表示されます。"
      image_url: null
      note: null
  title: "駐車エリアの削除"
  description: "駐車エリアの削除手順を説明します"
  steps:
    - step: 1
      description: "駐車場一覧から駐車場名をクリックします。"
      image_url: null
      note: null
    - step: 2 
      description: "駐車エリア一覧から作成した駐車エリアのアクション'削除'を選択します。"
      image_url: null
      note: null
    - step: 3
      description: "削除ボタンを押すとメッセージが表示され、削除する場合はOKボタンを選択してください。取り消したい場合はキャンセルを選択してください。"
      image_url: null
      note: null
parking_space:
  title: "駐車スペースの作成"
  description: "駐車スペースの作成手順を説明します"
  steps:
    - step: 1
      description: "駐車場一覧から作成した駐車場をクリックします。"
      image_url: null
      note: null
    - step: 2
      description: "駐車エリア一覧から作成した駐車エリア名をクリックします。"
      image_url: null
      note: null
    - step: 3
      description: "右上の区画を新規登録を選択します。"
      image_url: null
      note: null
    - step: 4
      description: "必要な項目を記入し、作成を選択します。"
      image_url: null
      note: null
