          - "削除を取り消す場合は、キャンセルを選択"
          - "一度駐車場契約すると削除することはできません"
contract_parking_space:
  create:
    title: "駐車場契約の作成"
    description: "駐車場契約の作成手順を説明します"
    steps:
      - step: 1
        description: "右上のメニューバーから契約者管理を選択します。(PCの場合は左メニューから契約者管理を選択)"
        image_url: null
        note: null
      - step: 2
        description: "作成した契約者の項目'詳細'を選択します。"
        image_url: null
        note: "契約者を検索するには検索欄に名前・電話番号・住所で検索できます。"
      - step: 3
        description: "契約者情報詳細から'契約・管理(追加・編集)'を選択します。"
        image_url: null
        note: null
      - step: 4
        description: "新規契約を追加を選択します。"
        image_url: null
        note: null
      - step: 5
        description: "項目を記入して契約を確定するを選択します。"
        image_url: null
        note: 
          - "契約終了日が決まっていない場合は'契約終了日が未定'にチェックします。"
          - "契約しない場合は戻るを選択してください。"
  edit:
    title: "駐車場契約の契約終了日の設定"
    description: "駐車場契約の契約終了日の設定手順を説明します"
    steps:
      - step: 1
        description: "契約者管理から作成した契約者の項目の'詳細'を選択します。"
        image_url: null
        note: "契約者の検索は検索欄に名前・電話・住所で検索できます。"
      - step: 2
        description: "契約者情報詳細にある'契約・管理(追加・編集)'を選択します。"
        image_url: null
        note: null
      - step: 3
        description: "現在契約している欄の操作'管理'を選択します。"
        image_url: null
        note: null
      - step: 4
        description: "契約内容の変更・管理から契約終了日の日付を設定し、変更を保存するを選択します。"
        image_url: null
        note:
          - "現在契約している契約開始日は変更できません。"
          - "本日中に契約を終了するときは、即日解約するをチェックします。"
